<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181B" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KrentProcent" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>KrentProcent - Bar Drink Value & Alcohol Calculator</title>
    <meta name="description" content="Smart bar alcohol value calculator and menu comparator. Compare volume, price, and ABV to find the best bang for your buck, with instant menu screenshot scanning." />
    <meta property="og:title" content="KrentProcent - Bar Drink Value & Alcohol Calculator" />
    <meta property="og:description" content="Smart bar alcohol value calculator and menu comparator. Compare volume, price, and ABV to find the best bang for your buck, with instant menu screenshot scanning." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('krentprocent_theme_v1');
          var isDark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          if (metas.length > 0) {
            metas[0].removeAttribute('media');
            metas[0].setAttribute('content', isDark ? '#18181B' : '#FFFFFF');
            for (var i = 1; i < metas.length; i++) metas[i].remove();
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
